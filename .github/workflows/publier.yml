name: Publier l'édition

on:
  push:
    branches: [main]
    paths:
      - "recap-horlogerie-semaine-*.html"
  workflow_dispatch:
    inputs:
      poster:
        description: "Poster aussi le lien dans le canal Telegram ?"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      latest: ${{ steps.build.outputs.latest }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Préparer le site
        id: build
        run: |
          mkdir _site
          cp recap-horlogerie-semaine-*.html _site/
          latest=$(for f in recap-horlogerie-semaine-*.html; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2)
          echo "Édition la plus récente : $latest"
          cp "_site/$latest" _site/index.html
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Préparer l'envoi
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Mettre en ligne
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    if: github.event_name == 'push' || inputs.poster
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v5

      - name: Poster le lien dans le canal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          LATEST: ${{ needs.deploy.outputs.latest }}
        run: python3 notify.py
